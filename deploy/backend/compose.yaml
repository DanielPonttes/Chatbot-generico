name: procelbot-backend

services:
  chatbot:
    build:
      # No servidor, este compose é executado dentro do checkout em
      # /opt/procelbot-backend; o contexto aponta para a raiz do projeto.
      context: ../..
      dockerfile: Dockerfile
    container_name: procelbot-chatbot
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: "2.0"
    env_file:
      - ./secrets/backend.env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    expose:
      - "8000"
    tmpfs:
      - /tmp
    volumes:
      - procelbot_chatbot_data:/app/data
    networks:
      procelbot_internal:
        aliases:
          - chatbot

networks:
  procelbot_internal:
    external: true
    name: procelbot_internal

volumes:
  procelbot_chatbot_data:
    name: procelbot_chatbot_data
