name: procelbot-backend

services:
  chatbot:
    build:
      # No servidor, este compose é executado dentro do checkout em
      # /opt/procelbot-backend; o contexto aponta para a raiz do projeto.
      context: ../..
      dockerfile: Dockerfile
    container_name: procelbot-chatbot
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: "2.0"
    env_file:
      - ./secrets/backend.env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      NODE_METRICS_PATH: /run/procelbot/node-metrics/latest.json
      NODE_METRICS_MAX_AGE_SECONDS: "60"
    expose:
      - "8000"
    tmpfs:
      - /tmp
    volumes:
      - procelbot_chatbot_data:/app/data
      # Snapshot gerado pelo agente do host; o backend só precisa ler.
      - /var/lib/procelbot/node-metrics:/run/procelbot/node-metrics:ro
    networks:
      procelbot_internal:
        aliases:
          - chatbot

networks:
  procelbot_internal:
    external: true
    name: procelbot_internal

volumes:
  procelbot_chatbot_data:
    name: procelbot_chatbot_data
